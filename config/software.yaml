# ============================================================================
# software.yaml — 软件参数（出厂默认初值）
#
# 用途：保护阈值、通信、控制（FOC 预留）参数的唯一来源。
# 说明：YAML 仅为出厂初值；将来在线辨识/整定结果经 flash 覆盖（设计文档 §7）。
# 表达式：引号字符串按计算式处理，构建期求值（跨文件引用 motor./hardware./software.）。
# ============================================================================

params_generation: 1         # flash记忆清除控制：bump本值→本次烧录忽略flash记忆值并用出厂值替换

can:
  baudrate: 1000000          # CAN 波特率 [bps]
  node_id_default: 1         # 占位：DIP 解码未实现时的回退节点号（与 CAN ID 的派生关系待协议定稿）
  rx_control_id: 0x101       # 接收控制帧 CAN ID（占位：待 CAN 协议定稿）
  tx_report_id: 0x181        # 参数回报帧 CAN ID（占位：待 CAN 协议定稿）

fault:
  shutdown_en: 1                          # 1=故障触发停机（FAULT 锁存）；0=台架模式：过流/健康类仅告警不停机（母线过压/欠压仍停机，硬件风险）
  oc_trip_a: "3 * motor.i_peak_10s_a"     # 过流阈值 [A] → 72.9
  vbus_ov_v: 36.0                         # 母线过压 [V]（24V 系统门限，1.5× 系统额定）
  vbus_uv_v: 9.0                          # 母线欠压 [V]（24V 系统门限）
  slow_debounce: 5                        # L2/L3 去抖次数（连续 1kHz tick）
  adc_stall_ms: 10                        # PMT 帧停滞超时 [ms]
  enc_err_delta: 3                        # 编码器错误增量阈值（每 1kHz tick 的错误计数增量）
  # —— 时序量：占位，待 FOC 时序体系定义后接入（当前代码使用内部宏：250 样本 / 50 tick）——
  # rms_window_samples: 250
  # settle_ticks: 50

control:
  # FOC 电流环（V1 落地；增益 = 手册 R/L + 极点对消初值，V2 自整定更新）
  current_loop:
    # G66-18 KV70 星型：手册线R=0.316Ω、线L=0.237mH，按相值R=0.158Ω、L=118.5µH设计。
    # 1kHz目标带宽试验，25kHz采样；模型初值，不等于实测稳定性认证。
    # Ki为连续增益，算法内部乘Ts=40us；不得在这里重复乘Ts。Flash FCUR可覆盖默认值。
    kp: 0.744557459         # [V/A] = Ls × (2π×1000Hz)
    ki: 992.743278534       # [V/(A·s)] = Rs × (2π×1000Hz)
    bandwidth_rad_s: 6283.185307180  # 目标带宽 [rad/s]（自整定用）
    decoupling_en: 0         # 解耦前馈（0/1；V1 关闭）
  speed_loop:
    kp: 50.0                  # [Nm/(rad/s)] 速度环P（轴端；机上整定值2026-10-15；0=禁用速度模式）
    ki: 1000.0                 # [Nm/rad] 速度环I（轴端；同上；motion gains 可在线改）
    friction_coulomb_nm: 1.1          # [Nm] 库仑摩擦前馈 Tc（机上整定值；motion friction cal 自整定）
    friction_viscous_nm_per_rad_s: -0.3 # [Nm/(rad/s)] 粘性摩擦前馈 Kv（可负=Stribeck斜率）
    friction_smoothing_rad_s: 0.05     # [rad/s] 平滑符号速度尺度（模型常量；0=硬符号）
    velocity_lpf_coeff: 0.025       # 测速一阶滤波系数（有效域(0,1]）
  limits:
    i_q_max_a: "motor.i_peak_10s_a"   # 电流矢量限幅 [A]（峰值口径 = 相电流峰值；须 > 0）→ 24.3
    i_trip_a: 0.0                     # 快速过流跳闸 [A]（峰值口径；0 = 关闭；连续 2 拍超限 → 零矢量+关桥+FAULT）
    speed_max_rad_s: 0.0            # 转矩模式限速 [rad/s 电角]（0 = 关闭；超限零转矩，速度回落自动恢复；G66-18 额定 3300rpm≈3456rad/s）
    duty_max: 0.95                     # 24V空载速度试验选定；高占空比采样精度仍需波形验证
    motion_iq_max_a: 25.0               # [A] motion命令电流硬限制（力矩命令与速度PI输出上限）
    motion_speed_limit_rad_s: 0.0      # [rad/s] 轴端速度命令限（0 = 不限）
