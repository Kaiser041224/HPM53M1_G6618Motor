[workspace]
resolver = "2"
members = ["core", "sim", "tests"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "BSD-3-Clause"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
